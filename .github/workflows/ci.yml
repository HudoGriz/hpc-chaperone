name: Go CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l *.go)"
      - name: Unit tests
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=1 go build -o chaperone .
