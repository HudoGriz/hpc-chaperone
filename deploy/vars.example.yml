# Site variables for install.yml / uninstall.yml (ansible-playbook -e @this-file).
# Login nodes whose inventory name is not their FQDN need
# `chaperone_fqdn=<fqdn>` on their inventory line (the broker principal).

# May launch personas. When set, install makes the group's members exactly
# this list (removing a name revokes); unset, members are left alone.
chaperone_eligible_group: chaperone-users
chaperone_users: [alice, bob]

# Broker service user; required. This UID must be free on the login nodes
# and slurmdbd host.
chaperone_uid: 960

# Only if the login nodes' Slurm config cannot reach slurmdbd (configless
# Slurm with AccountingStorageHost=localhost):
# chaperone_slurmdbd_host: slurm.example.org
# chaperone_slurm_cluster: cluster

# Rendered to /etc/chaperone/policy.json; Slurm accounts are created from it.
# Each profile is its own identity <user>-<profile>; see README "Policy".
chaperone_policy:
  default_persona: ai
  eligible_groups: ["{{ chaperone_eligible_group }}"]
  personas:            # each: <user>-<profile>, HOME ~/.chaperone/<user>-<profile>
    ai:                 # your groups minus the banned ones; your HOME traversable only
      slurm_account: agents
      shell: /bin/bash  # login shell: reads your startup files
      ban_groups: [admins]
      # env: {DISABLE_AUTOUPDATER: "1"}  # the persona cannot update your installs
      # startup_files: []  # share none; default: .bash_profile .bash_login .profile .bashrc (read-only)
      # Optional, on the account; none by default:
      # slurm_limits: {MaxJobs: "50", MaxSubmitJobs: "200", GrpTRES: "cpu=64", MaxWall: "1-00:00:00"}
