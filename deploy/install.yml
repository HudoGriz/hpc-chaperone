---
# Install Chaperone on a site. Idempotent; uninstall.yml removes all of it.
# Run from the el9 CI artifact (binary + this directory, sha256-checked):
#
#   ansible-playbook -i inventory -e @site.yml deploy/install.yml
#
# Inventory groups: chaperone_ipa (one FreeIPA server), chaperone_slurmdbd
# (the slurmdbd host), chaperone (login nodes). Variables: vars.example.yml.
# Any failure on any host stops the whole run. Launches open last.
# --check runs the read-only checks; FreeIPA and Slurm scripts are skipped.

- name: Check the artifact
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Binary and scripts match the CI checksum
      ansible.builtin.command: sha256sum -c chaperone.sha256
      args:
        chdir: "{{ playbook_dir }}/.."
      changed_when: false
      check_mode: false

# Nothing in FreeIPA or Slurm changes until the policy parses on every login node.
- name: Login nodes, binary and policy
  hosts: chaperone
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Site tools the launcher and broker call
      ansible.builtin.shell: |
        for t in sudo visudo setfacl getfacl ipa sacctmgr kinit ipa-getkeytab; do
          command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
        done
      changed_when: false
      check_mode: false

    - name: Broker service user
      ansible.builtin.user:
        name: chaperone
        uid: "{{ chaperone_uid | default(960) }}"
        system: true
        create_home: false
        home: /var/lib/chaperone/broker
        shell: /sbin/nologin

    - name: Directories (root's grant record; the broker's Kerberos cache and lock)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/chaperone, owner: root, mode: "0755"}
        - {path: /var/lib/chaperone, owner: root, mode: "0755"}
        - {path: /var/lib/chaperone/broker, owner: chaperone, mode: "0700"}

    - name: Binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../chaperone"
        dest: /usr/local/bin/chaperone
        owner: root
        group: root
        mode: "0755"

    - name: Site policy
      ansible.builtin.copy:
        content: "{{ chaperone_policy | to_nice_json }}\n"
        dest: /etc/chaperone/policy.json
        owner: root
        group: root
        mode: "0644"

    - name: Policy parses as every user sees it
      ansible.builtin.command: runuser -u nobody -- /usr/local/bin/chaperone --list-personas
      changed_when: false
      when: not ansible_check_mode # the binary may not be installed yet

    # Only if this node's Slurm config cannot reach slurmdbd (configless with
    # AccountingStorageHost=localhost): the broker gets its own pointer.
    - name: Accounting-only Slurm config for the broker
      ansible.builtin.copy:
        dest: /etc/chaperone/slurm.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Chaperone deploy/install.yml: the broker's sacctmgr only.
          ClusterName={{ chaperone_slurm_cluster }}
          SlurmctldHost={{ chaperone_slurmdbd_host }}
          AuthType=auth/munge
          AccountingStorageType=accounting_storage/slurmdbd
          AccountingStorageHost={{ chaperone_slurmdbd_host }}
      when: chaperone_slurmdbd_host is defined

# Root on the IPA server, LDAPI autobind: no admin password involved.
- name: FreeIPA objects
  hosts: chaperone_ipa
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Broker role per login node; eligibility groups are site-managed
      ansible.builtin.script: >-
        {{ playbook_dir }}/ipa.py install {{ hostvars[item].chaperone_fqdn | default(item) }}
      args:
        executable: python3
      loop: "{{ groups['chaperone'] }}"
      register: ipa
      changed_when: ipa.stdout is search('^created ', multiline=True)

# slurmdbd authenticates the broker's sacctmgr by MUNGE UID: same UID here.
- name: Slurm accounts
  hosts: chaperone_slurmdbd
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Broker service user
      ansible.builtin.user:
        name: chaperone
        uid: "{{ chaperone_uid | default(960) }}"
        system: true
        create_home: false
        home: /var/lib/chaperone/broker
        shell: /sbin/nologin

    # Limits come from each profile's slurm_limits (validated: profiles
    # sharing an account agree); none by default.
    - name: Persona accounts and their limits, broker as coordinator
      ansible.builtin.script: >-
        {{ playbook_dir }}/slurm.sh install chaperone
        {% for p in chaperone_policy.personas.values() | unique(attribute='slurm_account') %}
        {{ p.slurm_account | quote }} {{ (((p.slurm_limits | default({})).items() | map('join', '=') | join(' ')) or '-') | quote }}
        {% endfor %}
      register: slurm
      changed_when: slurm.stdout is search('Adding|Modified')

- name: Login nodes, keytab and launches
  hosts: chaperone
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Broker keytab still works
      ansible.builtin.command: >-
        runuser -u chaperone -- kinit -k -t /etc/chaperone/chaperone.keytab -c MEMORY:check
        chaperone/{{ chaperone_fqdn | default(inventory_hostname) }}
      register: keytab
      changed_when: false
      failed_when: false
      check_mode: false

    # ipa.py lets this host's principal create the broker's keys: the keytab
    # is made here and never travels. Re-made when missing or stale.
    - name: Broker keytab
      ansible.builtin.shell: |
        set -e
        export KRB5CCNAME=FILE:/run/chaperone-host.ccache
        trap kdestroy EXIT
        umask 077
        rm -f /etc/chaperone/chaperone.keytab
        kinit -k host/{{ chaperone_fqdn | default(inventory_hostname) }}
        ipa-getkeytab -p chaperone/{{ chaperone_fqdn | default(inventory_hostname) }} -k /etc/chaperone/chaperone.keytab
      when: keytab.rc != 0

    - name: Keytab readable by the service user only
      ansible.builtin.file:
        path: /etc/chaperone/chaperone.keytab
        owner: chaperone
        group: chaperone
        mode: "0400"

    # Last: nobody launches into a half-installed setup.
    - name: Sudo rule for the identity switch only
      ansible.builtin.template:
        src: "{{ playbook_dir }}/chaperone.sudoers"
        dest: /etc/sudoers.d/chaperone
        owner: root
        group: root
        mode: "0440"
        validate: visudo -cf %s
