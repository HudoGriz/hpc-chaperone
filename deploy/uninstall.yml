---
# Remove Chaperone. Idempotent. Same inventory and variables as install.yml:
#
#   ansible-playbook -i inventory -e @site.yml deploy/uninstall.yml                        # retire
#   ansible-playbook -i inventory -e @site.yml -e chaperone_purge=true deploy/uninstall.yml # purge
#
# Both stop launches, jobs and persona processes and remove the software,
# the service user, the broker's rights and the Slurm objects.
# Retire (default) keeps each persona, disabled, and its group: what it
# created outside HOME stays owned by a named identity its human shares a
# group with. Installing again re-enables it.
# Purge also deletes personas and their groups. In HOME there is nothing to
# hand back: the persona's files there are already its human's.
# Order matters: no new launches, then no running jobs or sessions, then
# the directory. Any failure stops the whole run.

- name: Stop launches
  hosts: chaperone
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Remove sudo rule
      ansible.builtin.file:
        path: /etc/sudoers.d/chaperone
        state: absent

# Fails if persona jobs survive cancellation, so none writes after the next play.
- name: Slurm accounts
  hosts: chaperone_slurmdbd
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Cancel jobs, delete associations and accounts (job history stays)
      ansible.builtin.script: >-
        {{ playbook_dir }}/slurm.sh uninstall chaperone
        {{ chaperone_policy.personas.values() | map(attribute='slurm_account') | unique | join(' ') }}
      register: slurm
      changed_when: "'Deleting' in slurm.stdout"

    - name: Remove broker service user
      ansible.builtin.user:
        name: chaperone
        state: absent

# SIGTERM ends each session's command; the session then kills the
# persona's leftover processes and stops its HOME view.
- name: Stop persona sessions
  hosts: chaperone
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Stop chaperone _enter, then wait for it
      ansible.builtin.shell: |
        pkill -TERM -u root -x chaperone || exit 0
        for _ in $(seq 30); do pgrep -u root -x chaperone >/dev/null || exit 0; sleep 1; done
        pkill -KILL -u root -x chaperone
        exit 0
      changed_when: false

- name: FreeIPA objects
  hosts: chaperone_ipa
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Role, services, eligibility group; personas disabled (retire) or deleted with their groups (purge)
      ansible.builtin.script: >-
        {{ playbook_dir }}/ipa.py {{ 'uninstall' if chaperone_purge | default(false) | bool else 'retire' }}
        {{ hostvars[item].chaperone_fqdn | default(item) }}
        {{ chaperone_eligible_group | default('chaperone-users') }}
      args:
        executable: python3
      loop: "{{ groups['chaperone'] }}"
      register: ipa
      changed_when: ipa.stdout is search('^(deleted|disabled persona) ', multiline=True)

# Slurm resolves a persona name to a UID through SSSD: a reinstall must not
# map a new persona to a purged one's cached UID.
- name: Forget the deleted personas
  hosts: chaperone_slurmdbd
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Flush SSSD caches
      ansible.builtin.command: sss_cache -E
      changed_when: false
      failed_when: false

- name: Remove client and broker
  hosts: chaperone
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Binary, policy and keytab, broker state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/usr/local/bin/chaperone, /etc/chaperone, /var/lib/chaperone]

    - name: Remove broker service user
      ansible.builtin.user:
        name: chaperone
        state: absent

    - name: Refresh the SSSD cache (disabled or deleted personas)
      ansible.builtin.command: sss_cache -E
      changed_when: false
      failed_when: false
